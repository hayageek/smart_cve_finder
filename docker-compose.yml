services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Host-run Postgres/Redis: reach the Mac host from inside containers
      DATABASE_URL: postgresql://${POSTGRES_USER:-secscan}:${POSTGRES_PASSWORD:-changeme}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-secscan}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${REDIS_PORT:-6379}
      WORKSPACES_DIR: /data/workspaces
      REPORTS_DIR: /data/atlassian_reports
      LOGS_DIR: /data/logs
      WORKERS_AGENT_TEST_URL: http://workers:8082
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./volumes/workspaces:/data/workspaces
      - ./volumes/atlassian_reports:/data/atlassian_reports
      - ./volumes/logs:/data/logs
    ports:
      - '4000:4000'

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secscan}:${POSTGRES_PASSWORD:-changeme}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-secscan}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: ${REDIS_PORT:-6379}
      WORKSPACES_DIR: /data/workspaces
      REPORTS_DIR: /data/atlassian_reports
      LOGS_DIR: /data/logs
      CURSOR_API_KEY: ${CURSOR_API_KEY}
      CURSOR_AGENT_BIN: /usr/local/bin/cursor-agent
      DEBUG_AGENT: ${DEBUG_AGENT:-${DEBUG_CURSOR:-true}}
      SKILLS_DIR: /data/skills
      WORKER_AGENT_TEST_PORT: ${WORKER_AGENT_TEST_PORT:-8082}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./volumes/workspaces:/data/workspaces
      - ./volumes/atlassian_reports:/data/atlassian_reports
      - ./volumes/logs:/data/logs
      - ./skills:/data/skills:ro
    depends_on:
      api:
        condition: service_started

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        # Empty = same-origin /api and /socket.io (proxied by nginx to the API service)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    restart: unless-stopped
    ports:
      - '${UI_PORT:-3000}:80'
    depends_on:
      - api
